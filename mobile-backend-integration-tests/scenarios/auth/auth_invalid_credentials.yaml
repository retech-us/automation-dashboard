name: "2FA Authentication Failure with Invalid Credentials"
id: "auth_invalid_credentials"
description: "Verify mobile production code handles 401/400 authentication error and updates state to error"
platforms:
  - "android"
  - "ios"

steps:
  - name: "Attempt Login with Bad Credentials"
    endpoint: "api/v1/2fa/verify/"
    method: "POST"
    request:
      body:
        username: "invalid.user@retechlabs.com"
        password: "WrongPassword999!"
        device_id: "HEADLESS-TEST-DEVICE-002"
        token_type: "simple"
    response:
      statusCode: 400
      fixture: "auth/2fa_verify_invalid.json"
    expected:
      actions:
        - "AUTH_FAILED"
      state:
        isLoggedIn: false
        hasToken: false
        hasError: true
