# Contract baseline for GET /api/v1/tasks/{id}/action-list/retailer/
# Slice 4 — deterministic schema checks (not business-logic reimplementation)

version: 1
endpoint: /api/v1/tasks/{task_id}/action-list/retailer/
envelope: results_or_list  # {results:[...]} or bare [...]

item_required_fields:
  - id
  - action
  - product_title
  - store_planogram_id

item_field_types:
  id: [int]
  action: [str]
  product_title: [str]
  store_planogram_id: [int]
  displayed_upc: [str, "null"]
  upc: [str, "null"]
  product_id: [int, "null"]
  source_id: [int, "null"]
  state: [str, "null"]
  action_resolved: [bool, "null"]
  current_position: [dict, "null"]
  expected_position: [dict, "null"]

# At least one UPC-like field must be present and non-empty when item has product_id
upc_fields: [displayed_upc, upc]

# Known action tokens observed in retailer action-list (extend carefully)
known_actions:
  - ACTION_MOVE
  - ACTION_REMOVE
  - ACTION_ADD
  - ACTION_IDENTIFY
  - ACTION_RESTOCK
  - set_aside
  - fix_position_move_to_bay
  - fix_position_in_bay
  - place_on_shelf_add_to_bay
  - place_on_shelf_restock
  - remove
  - identify
  - exception
  - finish

# Soft rule: unknown action → warning (not hard fail) unless strict=true
unknown_action_policy: warn

position_object_allowed_keys:
  - action
  - section_info
  - shelf
  - position
  - scan_id
  - facing_width
  - facing_height
  - coordinates
  - realogram_item_id
  - planogram_item_id
  - state
  - bay
  - name
  - id
