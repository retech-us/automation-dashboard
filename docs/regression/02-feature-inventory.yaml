# Feature Inventory — Machine-Readable Seed

# Schema version: 1.0
# Status: discovery seed — expand before claiming full coverage
# Location convention: FEATURE-NNN

meta:
  generated: 2026-09-01
  owner: qa-platform
  primary_focus: Intelligent_Reset_and_release_critical_paths
  expansion_rule: >
    Every mobile screen/module must eventually receive a FEATURE-ID.
    This seed prioritizes IR, auth, tasks, capture, shifts, and contract-critical APIs.
  sources:
    - android-rebotics/features/rebotics_pog_reset
    - ios-rebotics/Screens/Modules/Tasks
    - rebotics-management-django/apps/tasks
    - automation-dashboard/mobile-backend-integration-tests
    - retech-api-automation IntelligenceResetApiTest
    - retech-mobile-automation featureFiles

features:

  - id: FEATURE-001
    name: Mobile Authentication (Password + 2FA)
    module: Auth
    mobile_entry_point:
      android: AuthorizationActivity / AuthorizationConfirmationActivity
      ios: AuthFlow/Auth + TwoFactorAuth
    user_intent: Obtain session token for Store Intelligence APIs
    backend_apis:
      - POST /api/v1/2fa/status/
      - POST /api/v1/2fa/obtain/
      - POST /api/v1/2fa/verify/
      - POST /api/v1/token/
      - POST /api/v1/refresh/
      - POST /api/v4/token-auth/  # legacy
      - GET /api/v4/me/
    http_methods: [POST, GET]
    request_schema: username, password, device_id, token_type
    response_schema: token | access+refresh JWT
    database_tables: [auth_user, authtoken_token, JWT blacklist]
    business_rules:
      - 2FA may be required when Constance ENABLE_TWO_FACTOR_AUTH
      - Mobile UA Store Intelligence / Rebotics
    mobile_processing: Store token + host in Preferences/Keychain; inject Authorization header
    state_changes: [UNAUTHENTICATED → AUTHENTICATED]
    navigation: Splash/Auth → Main/Tasks
    dependencies: [FEATURE-002]
    feature_flags: [ENABLE_TWO_FACTOR_AUTH]
    authentication_requirements: none (bootstrap)
    permissions: network
    success_conditions: [HTTP 200, non-empty token, /me returns user]
    failure_conditions: [401 invalid credentials, 429 throttle, 2FA failure]
    edge_cases: [SSO path, expired refresh, wrong host/instance]
    existing_tests:
      - MBIT scenarios/auth/*
      - retech-mobile-automation Login feature
      - Django master_data auth tests
    test_coverage: medium
    risk_level: high
    release_criticality: critical
    automation_status: partial_real_api
    headless_without_ui: yes
    dependency_class: REAL

