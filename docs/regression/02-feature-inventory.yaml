      - Android ActionListDomainMapperTest / WorkflowTest
      - API IntelligenceResetApiTest (partial)
    test_coverage: medium_lab
    risk_level: critical
    release_criticality: critical
    automation_status: simulated_mobile_plus_real_api
    headless_without_ui: partial  # API yes; Presenter sequencing no
    dependency_class: REAL_api_SIMULATED_mobile_map

