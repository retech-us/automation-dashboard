    request_schema: task id, pagination
    response_schema: action items with UPC, bay/shelf/pos, action type, images
    database_tables: [tasks_task, planograms_compliance_*, planogram comparison structures]
    business_rules:
      - IR exclusions via Constance pog_reset_excluded_checks
      - Actions derived from compliance/comparison pipeline
    mobile_processing: Map JSON → domain models → UI cards; sort/group by bay
    state_changes: [NO_ACTIONS → ACTIONS_LOADED]
    navigation: Task Detail → Action List
    dependencies: [FEATURE-010, FEATURE-030]
    feature_flags: [pog_reset_task_step_enabled]
    authentication_requirements: authenticated
    permissions: []
    success_conditions: [HTTP 200, schema valid, mappable items]
    failure_conditions: [404 task, empty when scans incomplete, 500]
    edge_cases: [duplicate UPC multi-location, multibay set-aside pairs]
    existing_tests:
