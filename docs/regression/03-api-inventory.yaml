# API Inventory (seed)

meta:
  generated: 2026-09-01
  sources:
    - rebotics-management-django/config/urls/api/v1.py
    - rebotics-management-django deprecated v4 routes
    - docs/swagger/main.yaml
    - MBIT adapters android_adapter.py / ios_adapter.py
    - retech-api-automation clients
  note: >
    Dual API generations (v1 + v4). Mobile still depends on v4 processing spine.
    Expand by downloading OpenAPI auto-docs into versioned baselines.

