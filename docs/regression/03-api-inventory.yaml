contract_validation_rules:
  - Detect missing required fields
  - Detect type/nullability/enum changes vs baseline
  - Detect HTTP status class changes on success paths
  - Detect unexpected breaking renames
  - Report MOBILE/BACKEND CONTRACT BREAK with expected vs actual

baseline_strategy:
  store_under: docs/regression/baselines/openapi/
  update_policy: explicit PR with contract review
  gate: fail CI on breaking changes unless waiver label
