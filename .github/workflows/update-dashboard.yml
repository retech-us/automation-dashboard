name: Update Dashboard

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [run-summary-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live run summaries from all repos
        run: |
          python3 scripts/fetch-summaries.py data
          python3 scripts/generate-bootstrap.py

      # Optional Pages GenAI without browser paste: set variable GENAI_REMOTE_PROXY_URL
      # after deploying workers/chat-proxy. Otherwise use Connect GenAI on the live site.
      - name: Inject GenAI remote proxy URL for Pages
        env:
          GENAI_REMOTE_PROXY_URL: ${{ vars.GENAI_REMOTE_PROXY_URL }}
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          path = Path("data/genai-config.json")
          cfg = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          proxy = (os.environ.get("GENAI_REMOTE_PROXY_URL") or "").strip().rstrip("/")
          if proxy:
              cfg["remoteProxyUrl"] = proxy
              print(f"GenAI remoteProxyUrl → {proxy}")
          else:
              cfg["remoteProxyUrl"] = ""
              print("No GENAI_REMOTE_PROXY_URL — Pages GenAI via Connect GenAI button.")
          path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: false
          exclude_assets: '.github,.env,Dockerfile,docker-compose.yml,.dockerignore'
