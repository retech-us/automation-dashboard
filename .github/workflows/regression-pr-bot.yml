name: Regression Gate A (on demand)

# On-demand from Actions UI + scheduled cron. Does NOT run on every PR.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pack mode (smoke | impacted | full)
        required: false
        default: smoke
      env:
        description: Target env slug
        required: false
        default: epsilon
  schedule:
    # Weekdays 06:00 UTC — adjust as needed
    - cron: "0 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: regression-gate-a
  cancel-in-progress: true

jobs:
  gate-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Unit tests (slices 1–7)
        run: |
          python3 -m unittest \
            regression.tests.test_slice1_env_and_images \
            regression.tests.test_slice2_auth_smoke \
            regression.tests.test_slice3_provisioner \
            regression.tests.test_slice4_action_list \
            regression.tests.test_slice5_domain_parity \
            regression.tests.test_slice6_tools_api \
            regression.tests.test_slice7_pr_bot -v

      - name: Run Gate A pack
        id: bot
        env:
          REGRESSION_NARRATIVE_MODE: template
        run: |
          MODE="${{ github.event.inputs.mode || 'smoke' }}"
          ENV="${{ github.event.inputs.env || 'epsilon' }}"
          python3 regression/cli.py pr-bot run \
            --env="$ENV" \
            --mode="$MODE" \
            --sha="${{ github.sha }}" \
            --json-out=regression-gate-a.json \
            --comment-out=regression-gate-a.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-a
          path: |
            regression-gate-a.json
            regression-gate-a.md
          if-no-files-found: ignore
