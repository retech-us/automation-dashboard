# Optional: smoke-check that GitHub secret OPENAI_KEY reaches the Symphony gateway.
# Does not publish the key to GitHub Pages.
name: genai-key-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify OPENAI_KEY secret is configured
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo "::error::GitHub secret OPENAI_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "OPENAI_KEY is present (length ${#OPENAI_KEY})."

      - name: Call Symphony chat completions
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          curl -sS -o /tmp/genai.json -w "%{http_code}" \
            -X POST "https://ai-api.symphonyretailai.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_KEY" \
            -d '{"model":"gpt-4.1","messages":[{"role":"user","content":"Reply with OK only."}],"temperature":0}' \
            > /tmp/status.txt
          STATUS=$(cat /tmp/status.txt)
          echo "HTTP $STATUS"
          head -c 400 /tmp/genai.json; echo
          test "$STATUS" = "200"
