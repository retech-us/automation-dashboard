name: Shelf Intelligence Quality Automation & Regression

on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Target backend instance / company'
        required: true
        default: 'local-mock'
        type: choice
        options:
          - local-mock
          - epsilon
          - krcs
          - harr
          - custom
      custom_backend_url:
        description: 'Custom Backend URL (required if instance=custom)'
        required: false
        default: ''
        type: string
      target_repository:
        description: 'Target repository for commit resolution'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - android
          - ios
      branch:
        description: 'Git branch to resolve and verify'
        required: false
        default: 'current'
        type: string
      commit_sha:
        description: 'Specific 40-char commit SHA (or auto)'
        required: false
        default: 'auto'
        type: string
      test_scope:
        description: 'Test scope to execute'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression
          - ai_benchmark
          - api
          - rules
          - all
      execution_mode:
        description: 'Execution mode (dry_run guarantees zero remote mutations)'
        required: true
        default: 'dry_run'
        type: choice
        options:
          - dry_run
          - live
      platform:
        description: 'Target mobile platform parity'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

  pull_request:
    branches: [master, main, develop]
    paths:
      - 'mobile-backend-integration-tests/**'

  schedule:
    # Nightly regression run at 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: shelf-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-suite:
    name: Shelf Intelligence Quality & Compliance Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Quality Automation Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'
        continue-on-error: true

      - name: Install Runtime Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml || true

      - name: 1. Preflight Validation & Git Source Resolution
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: |
          INSTANCE="${{ github.event.inputs.instance || 'local-mock' }}"
          MODE="${{ github.event.inputs.execution_mode || 'dry_run' }}"
          BRANCH="${{ github.event.inputs.branch || 'current' }}"
          COMMIT="${{ github.event.inputs.commit_sha || 'auto' }}"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          URL_ARG=""
          if [ "$INSTANCE" = "custom" ] && [ -n "${{ github.event.inputs.custom_backend_url }}" ]; then
            URL_ARG="--backend ${{ github.event.inputs.custom_backend_url }}"
          fi

          echo "🚀 Running Preflight Validation for target instance: $INSTANCE ($MODE mode)..."
          PYTHONPATH=mobile-backend-integration-tests python3 mobile-backend-integration-tests/runner/scenario_runner.py \
            --env "$INSTANCE" \
            ${MODE:+--dry-run} \
            --platform "$PLATFORM" \
            --branch "$BRANCH" \
            --commit "$COMMIT" \
            $URL_ARG \
            --preflight-only

      - name: 2. Core Unit, Invariants & Schema Contract Tests (383+ tests)
        run: |
          echo "🧪 Running full unit, API schema contract, and invariant test suite..."
          PYTHONPATH=mobile-backend-integration-tests python3 -m unittest discover \
            -s mobile-backend-integration-tests/tests \
            -p "test_*.py" -v

      - name: 3. Computer Vision & AI Ground Truth Benchmarking
        if: github.event.inputs.test_scope == 'ai_benchmark' || github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'regression' || github.event_name == 'pull_request' || github.event_name == 'schedule'
        run: |
          echo "🎯 Evaluating Hawkeye AI Computer Vision Bounding Box IoU & Action Precision/Recall..."
          PYTHONPATH=mobile-backend-integration-tests python3 mobile-backend-integration-tests/runner/scenario_runner.py \
            --benchmark

      - name: 4. Headless Multi-Scenario & Cross-Platform Parity Regression
        if: github.event.inputs.test_scope != 'ai_benchmark'
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: |
          INSTANCE="${{ github.event.inputs.instance || 'local-mock' }}"
          MODE="${{ github.event.inputs.execution_mode || 'dry_run' }}"
          BRANCH="${{ github.event.inputs.branch || 'current' }}"
          COMMIT="${{ github.event.inputs.commit_sha || 'auto' }}"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          URL_ARG=""
          if [ "$INSTANCE" = "custom" ] && [ -n "${{ github.event.inputs.custom_backend_url }}" ]; then
            URL_ARG="--backend ${{ github.event.inputs.custom_backend_url }}"
          fi

          echo "📱 Executing 18 Headless Mobile-Backend Scenarios against $INSTANCE..."
          PYTHONPATH=mobile-backend-integration-tests python3 mobile-backend-integration-tests/runner/scenario_runner.py \
            --env "$INSTANCE" \
            ${MODE:+--dry-run} \
            --platform "$PLATFORM" \
            --branch "$BRANCH" \
            --commit "$COMMIT" \
            $URL_ARG

      - name: 5. Generate Master End-to-End Executive HTML Report
        if: always()
        run: |
          echo "📊 Generating Master End-to-End Executive HTML Report..."
          PYTHONPATH=mobile-backend-integration-tests python3 mobile-backend-integration-tests/runner/run_all_end_to_end.py

      - name: Upload Test Artifacts, JUnit XML & AI Scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-intelligence-artifacts-${{ github.run_id }}
          path: |
            mobile-backend-integration-tests/test-reports/*.xml
            mobile-backend-integration-tests/test-reports/*.json
            mobile-backend-integration-tests/test-reports/*.md
            mobile-backend-integration-tests/test-reports/*.html
          if-no-files-found: warn
