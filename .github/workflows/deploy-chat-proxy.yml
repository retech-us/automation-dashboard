# Optional: deploy Cloudflare Worker so Pages GenAI works without pasting a key.
# Manual only. Skip if you use Connect GenAI / local Docker instead.
#
# Secrets: OPENAI_KEY, CLOUDFLARE_API_TOKEN (optional CLOUDFLARE_ACCOUNT_ID)
# After deploy: set variable GENAI_REMOTE_PROXY_URL to the worker URL, re-run Update Dashboard.
name: Deploy GenAI chat proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$OPENAI_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — add OPENAI_KEY and CLOUDFLARE_API_TOKEN, or use Connect GenAI on Pages / local Docker."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Deploy worker + sync OPENAI_KEY
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy
          secrets: |
            OPENAI_KEY
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
