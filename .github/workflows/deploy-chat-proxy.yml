# Optional: deploy Cloudflare Worker chat proxy for GenAI on GitHub Pages.
# Manual only — skip if you are not using Cloudflare (local Docker / GHCR is enough).
#
# Required secrets (repo Settings → Secrets and variables → Actions):
#   OPENAI_KEY              — same as web automation
#   CLOUDFLARE_API_TOKEN    — Workers Edit permission
# Optional:
#   CLOUDFLARE_ACCOUNT_ID
#
# After deploy: set variable GENAI_REMOTE_PROXY_URL to the worker URL (no trailing slash),
# then re-run Update Dashboard.
name: Deploy GenAI chat proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$OPENAI_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### GenAI chat proxy deploy skipped"
              echo ""
              echo "Add these secrets under **Settings → Secrets and variables → Actions**, then re-run this workflow:"
              echo ""
              if [ -z "$OPENAI_KEY" ]; then echo "- \`OPENAI_KEY\` (same value as web automation)"; fi
              if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "- \`CLOUDFLARE_API_TOKEN\` (Cloudflare Workers Edit)"; fi
              echo ""
              echo "If you only need GenAI locally/CI Docker, you can ignore this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipping Cloudflare deploy — OPENAI_KEY and/or CLOUDFLARE_API_TOKEN not configured."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy worker + sync OPENAI_KEY
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy
          secrets: |
            OPENAI_KEY
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
