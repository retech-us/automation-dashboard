services:
  dashboard:
    build: .
    image: automation-dashboard:local
    ports:
      - "8765:8765"
    environment:
      # Same key as GitHub Actions secret OPENAI_KEY / web automation
      OPENAI_KEY: ${OPENAI_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://ai-api.symphonyretailai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8765"
    # Optional: mount local key file instead of env
    # volumes:
    #   - ./data/local-openai.json:/app/data/local-openai.json:ro
    restart: unless-stopped
